name: Build Windows Simcraft Installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled executable
        shell: pwsh
        run: |
          if (!(Test-Path 'windows/payload/SimcraftStudio.exe')) { throw 'Missing SimcraftStudio.exe' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\Simcraft.iss"'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Simcraft-Studio-Windows-Installer
          path: windows/output/Simcraft-Studio-Setup.exe
          if-no-files-found: error

      - name: Publish versioned Windows release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo "Release v1.0.2 already exists; leaving it unchanged."
          else
            gh release create v1.0.2 'windows/output/Simcraft-Studio-Setup.exe' --target "$GITHUB_SHA" --title "Simcraft Studio 1.0.1 (Windows)" --notes "Version 1.0.2: AI Mod Studio tab and desktop workspace. Automatic signed installation remains disabled pending signing configuration."
          fi
