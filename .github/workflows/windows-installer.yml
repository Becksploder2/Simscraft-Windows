name: Build Simcraft Portable Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native tabbed app with legacy resources
        shell: pwsh
        run: |
          dotnet publish windows/native/SimcraftNative.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o windows/native/publish
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item windows/payload/* portable -Recurse -Force
          Copy-Item windows/native/publish/SimcraftNative.exe portable/SimcraftStudio.exe -Force
          Compress-Archive -Path portable/* -DestinationPath Simcraft-Studio-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simcraft-Studio-Windows-Portable
          path: Simcraft-Studio-Windows-Portable.zip
          if-no-files-found: error
      - name: Publish portable update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v1.0.11 >/dev/null 2>&1; then
            gh release create v1.0.11 Simcraft-Studio-Windows-Portable.zip --target "$GITHUB_SHA" --title "Simcraft Studio 1.0.11 Windows Portable Update" --notes "Native tabbed workspace and original CAS room background with crash safeguards. Portable ZIP, no installer."
          fi
