name: Build Windows Simcraft Installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled executable
        shell: pwsh
        run: |
          if (!(Test-Path 'windows/payload/SimcraftStudio.exe')) { throw 'Missing SimcraftStudio.exe' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\Simcraft.iss"'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Simcraft-Studio-Windows-Installer
          path: windows/output/Simcraft-Studio-Setup.exe
          if-no-files-found: error

      - name: Publish versioned Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "windows/output/Simcraft-Studio-Setup.exe" --title "Simcraft Studio $env:GITHUB_REF_NAME (Windows)" --notes "Windows installer update. Existing updater requires signing-key configuration and a compatible signed update package." --verify-tag
