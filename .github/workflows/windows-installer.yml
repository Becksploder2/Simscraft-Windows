name: Build Simcraft Portable Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/payload/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package restored legacy app without installer
        shell: pwsh
        run: |
          if (!(Test-Path windows/payload/SimcraftStudio.exe)) { throw "Legacy executable missing" }
          Compress-Archive -Path windows/payload/* -DestinationPath Simcraft-Studio-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simcraft-Studio-Windows-Portable
          path: Simcraft-Studio-Windows-Portable.zip
          if-no-files-found: error
      - name: Publish rollback release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v1.0.7 >/dev/null 2>&1; then
            gh release create v1.0.7 Simcraft-Studio-Windows-Portable.zip --target "$GITHUB_SHA" --title "Simcraft Studio 1.0.7 Windows Portable Rollback" --notes "Restores the pre-native executable and assets. No installer. Native tab migration will be handled separately."
          fi
