name: Build Windows Simcraft Installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native desktop executable
        shell: pwsh
        run: dotnet publish windows/native/SimcraftNative.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o windows/native/publish
      - name: Replace legacy executable in installer payload
        shell: pwsh
        run: Copy-Item windows/native/publish/SimcraftNative.exe windows/payload/SimcraftStudio.exe -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\Simcraft.iss"'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Simcraft-Studio-Windows-Installer
          path: windows/output/Simcraft-Studio-Setup.exe
          if-no-files-found: error

      - name: Publish versioned Windows release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.6 >/dev/null 2>&1; then
            echo "Release v1.0.6 already exists; leaving it unchanged."
          else
            gh release create v1.0.6 'windows/output/Simcraft-Studio-Setup.exe' --target "$GITHUB_SHA" --title "Simcraft Studio 1.0.6 Native Preview (Windows)" --notes "Version 1.0.2: AI Mod Studio tab and desktop workspace. Automatic signed installation remains disabled pending signing configuration."
          fi
