name: Simscraft Windows Test Build (No Release)
on:
  workflow_dispatch:
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Bundle standalone face analyzer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mediapipe>=0.10.14,<0.11" "Pillow>=10,<13" "numpy<2" pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SimcraftFaceAnalyzer --collect-all mediapipe --collect-all cv2 windows/payload/FaceEngine/analyze_faces.py
          if (!(Test-Path dist/SimcraftFaceAnalyzer/SimcraftFaceAnalyzer.exe)) { throw "Face analyzer executable missing" }
          New-Item -ItemType Directory -Force -Path windows/payload/FaceEngine/BundledAnalyzer | Out-Null
          Copy-Item dist/SimcraftFaceAnalyzer/* windows/payload/FaceEngine/BundledAnalyzer -Recurse -Force
      - name: Build native tabbed app with legacy resources
        shell: pwsh
        run: |
          dotnet publish windows/native/SimcraftNative.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o windows/native/publish
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item windows/payload/* portable -Recurse -Force
          New-Item -ItemType Directory -Force -Path portable/Models | Out-Null
          Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task" -OutFile portable/Models/face_landmarker.task
          if ((Get-Item portable/Models/face_landmarker.task).Length -lt 100000) { throw "Face landmarker model download failed validation" }
          git clone --depth 1 https://github.com/Becksploder2/simcraft-studio-mac.git template-source
          New-Item -ItemType Directory -Force -Path portable/Templates | Out-Null
          Copy-Item template-source/Assets/FaceTemplates/Female portable/Templates/Female -Recurse -Force
          Copy-Item template-source/Assets/FaceTemplates/Male portable/Templates/Male -Recurse -Force
          Copy-Item windows/native/publish/SimcraftNative.exe portable/SimcraftStudio.exe -Force
          Compress-Archive -Path portable/* -DestinationPath Simcraft-Studio-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simscraft-Windows-Test-Portable
          path: Simcraft-Studio-Windows-Portable.zip
          if-no-files-found: error
